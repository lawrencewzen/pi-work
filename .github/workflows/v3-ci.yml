name: v3 checks
on:
  push:
    branches: [main, "feat/v3-task-center"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright e2e
        run: |
          export PI_WORK_SHOTS="${RUNNER_TEMP}/pi-work-shots"
          mkdir -p "$PI_WORK_SHOTS"
          npm run test:e2e
      - name: Stage screenshots
        if: failure()
        run: mkdir -p e2e-shots && cp -a "${RUNNER_TEMP}/pi-work-shots/." e2e-shots/ || true
      - name: Upload Playwright report and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-shots/
          if-no-files-found: ignore
          retention-days: 7
