name: kernel windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/kernel-harness]

jobs:
  kernel-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Pi Durable kernel unit tests
        run: node --test tests/unit/kernel.test.mjs
      - name: Pi Durable conversation HTTP tests
        run: node --test tests/unit/kernel-conversations.test.mjs
      - name: Pi Durable archived conversation tests
        run: node --test tests/unit/kernel-archive.test.mjs
      - name: Pi Durable workspace tool tests
        run: node --test tests/unit/kernel-tools.test.mjs
      - name: Pi Durable model source tests
        run: node --test tests/unit/kernel-models.test.mjs
      - name: Pi Durable role and pipeline tests
        run: node --test tests/unit/kernel-roles.test.mjs
      - name: Pi Durable usage chip and plugin reload tests
        run: node --test tests/unit/kernel-usage-plugins.test.mjs
      - name: Pi Durable subagent tests
        run: node --test tests/unit/kernel-subagents.test.mjs
      - name: Pi Durable pause, stall, retry, and tool limit tests
        run: node --test tests/unit/kernel-control.test.mjs
