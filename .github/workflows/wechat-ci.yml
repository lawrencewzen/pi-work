name: WeChat bridge checks

on:
  pull_request:
    paths:
      - "deploy/wechat/**"
      - "compose.yaml"
      - ".github/workflows/wechat-ci.yml"
  push:
    branches: [main]
    paths:
      - "deploy/wechat/**"
      - "compose.yaml"
      - ".github/workflows/wechat-ci.yml"
  workflow_dispatch:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose syntax
        run: |
          cp .env.example .env
          docker compose --profile wechat config --quiet
      - name: Pull official wx-bot image
        run: docker compose --profile wechat pull wx-bot
