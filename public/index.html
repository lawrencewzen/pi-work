<!DOCTYPE html>
<html lang="zh-CN" data-theme="white-light" data-font-size="md">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weft</title>
  <link rel="stylesheet" href="/themes.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app-shell" id="app-shell">

    <!-- Left: projects and conversations -->
    <aside class="col-left" id="col-left">
      <div class="left-top">
        <button type="button" class="new-chat-btn" data-action="new-chat-top" data-testid="new-chat-top">
          <span data-i18n="new_conversation">新对话</span>
        </button>
        <button type="button" class="icon-btn" data-action="toggle-left" data-i18n-title="collapse_sidebar" title="收起侧栏">
          <span class="ico-panel ico-panel-left" aria-hidden="true"></span>
        </button>
      </div>

      <div class="left-body">
        <div class="left-section-label">
          <span data-i18n="projects_label">项目</span>
          <button type="button" class="btn-icon-xs" data-testid="workspace-new" data-action="new-workspace" data-i18n-title="new_workspace" title="新建工作区">+</button>
        </div>
        <div class="tree-root" id="ws-tree-container"></div>
      </div>

      <div class="left-footer">
        <button type="button" class="foot-link" data-action="open-settings" data-i18n="settings_short" data-i18n-title="settings_title" title="系统设置">设置</button>
        <span class="left-footer-right">
          <span class="runtime-meta" id="runtime-meta" data-i18n-title="runtime_name" title="持久化运行时（SQLite 日志）">
            <span class="runtime-ping"></span>
          </span>
          <button type="button" class="icon-btn is-sm" id="mode-toggle" data-action="toggle-mode" data-testid="mode-toggle"></button>
        </span>
      </div>
    </aside>
    <div class="col-divider" id="left-divider" data-side="left" data-i18n-title="drag_resize" title="拖动调整宽度，双击复位"></div>

    <!-- Center: conversation -->
    <main class="col-center" id="col-center">
      <header class="center-top-bar" data-testid="status-bar" id="status-bar">
        <div class="top-left">
          <button type="button" class="icon-btn top-left-open" data-action="toggle-left" data-i18n-title="expand_sidebar" title="展开侧栏">
            <span class="ico-panel ico-panel-left" aria-hidden="true"></span>
          </button>
          <span class="top-title" id="top-title" data-testid="top-title"></span>
          <span class="topbar-ws-name" id="topbar-workspace" data-testid="topbar-workspace"></span>
          <span class="status-pill" id="status-pill" data-i18n-title="status_title" title="当前执行状态">
            <span class="status-dot dot-idle" id="status-dot" data-testid="status-dot" data-status="idle"></span>
            <span id="status-text" data-testid="status-text">就绪</span>
          </span>
          <span id="demo-model-badge" class="demo-model-badge is-hidden" data-testid="demo-model-badge" data-i18n="demo_model_badge">演示模型</span>
        </div>
        <div class="top-right">
          <button type="button" class="icon-btn top-right-open" data-action="toggle-right" data-i18n-title="expand_panel" title="展开面板">
            <span class="ico-panel ico-panel-right" aria-hidden="true"></span>
            <span class="top-right-dot" id="right-open-dot"></span>
          </button>
        </div>
      </header>

      <div id="center-notice" class="center-notice"></div>

      <div class="draft-hero" id="draft-hero">
        <span data-i18n="draft_hero_pre">要在</span>
        <button type="button" class="draft-proj" data-action="pick-draft-project" data-testid="draft-project">
          <span id="draft-proj-name"></span><span class="caret">▾</span>
        </button>
        <span data-i18n="draft_hero_post">里做什么？</span>
      </div>

      <div class="center-thread" id="center-thread"></div>

      <footer class="center-composer">
        <div class="composer-stack">
          <div class="composer-box">
            <textarea class="composer-textarea" data-testid="chat-input" data-i18n-placeholder="composer_placeholder" placeholder="继续对话，@ 引用文件，/ 使用命令"></textarea>
            <div class="composer-bar">
              <div class="composer-chips">
                <div class="chip-selector-wrap" id="composer-agent-wrap">
                  <button type="button" class="chip-selector" id="composer-agent-chip-btn" data-action="toggle-agent-picker" data-testid="composer-agent" title="当前调度模型" aria-haspopup="listbox" aria-expanded="false">
                    <span id="composer-agent-chip">未配置模型</span><span class="caret">▾</span>
                  </button>
                  <div id="composer-agent-menu" class="chip-menu" role="listbox" data-testid="composer-agent-menu"></div>
                </div>
                <span id="demo-model-chip" class="demo-model-badge is-hidden" data-testid="demo-model-chip" data-i18n="demo_model_badge">演示模型</span>
                <button type="button" class="chip-plain" id="composer-project-chip" data-action="project-chip-menu" data-testid="composer-project">
                  <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 3.2c0-.6.4-1 1-1h2.3l1 1.2h3.7c.6 0 1 .4 1 1v4.4c0 .6-.4 1-1 1h-7c-.6 0-1-.4-1-1z"></path></svg>
                  <span id="composer-project-name"></span>
                </button>
              </div>
              <div class="composer-actions">
                <div class="chip-selector-wrap" id="composer-context-wrap">
                  <div class="chip-context" id="composer-context" data-testid="composer-context"><span class="chip-context-display" id="composer-context-display"><svg class="ctx-ring" viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><circle class="ctx-ring-track" cx="7" cy="7" r="5" fill="none" stroke-width="2"></circle><circle class="ctx-ring-fill" id="composer-context-ring" cx="7" cy="7" r="5" fill="none" stroke-width="2"></circle></svg><span id="composer-context-value">已用 0% · 剩 100% · </span></span><button type="button" class="chip-context-limit" id="composer-context-limit-btn" data-action="toggle-context-menu" data-testid="composer-context-limit" aria-haspopup="menu" aria-expanded="false" disabled><span class="ctx-window" id="composer-context-window">128k</span><svg class="ctx-caret" viewBox="0 0 8 8" width="8" height="8" aria-hidden="true"><path d="M1.5 2.5h5L4 6z"></path></svg></button></div>
                  <div id="composer-context-menu" class="chip-menu chip-context-menu" role="menu" data-testid="composer-context-menu"></div>
                </div>
                <button type="button" class="btn-send" data-testid="chat-send" data-action="send-message" data-i18n-title="send_title" title="发送">
                  <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 11.5V2.5M3 6.5l4-4 4 4"></path></svg>
                </button>
              </div>
            </div>
          </div>
          <div class="draft-hint" id="draft-hint"></div>
        </div>
      </footer>
    </main>

    <div class="col-divider" id="right-divider" data-side="right" data-i18n-title="drag_resize" title="拖动调整宽度，双击复位"></div>

    <!-- Right: changes / files / sub-agent -->
    <aside class="col-right" data-testid="right-panel" id="right-panel">
      <header class="right-tabs-bar">
        <nav class="tabs-nav">
          <button type="button" class="tab-btn active" id="tab-btn-diff" data-action="switch-right-tab" data-tab="diff" data-i18n-title="tab_diff_title" title="改动">
            <span data-i18n="tab_diff">变更</span>
            <span class="tab-stat" id="diff-tab-stat"></span>
            <span class="tab-badge" id="diff-tab-badge">0</span>
          </button>
          <button type="button" class="tab-btn" id="tab-btn-file" data-action="switch-right-tab" data-tab="file" data-i18n-title="tab_file_title" title="查看文件">
            <span data-i18n="tab_file">文件</span>
          </button>
          <span id="agent-tab-slot" class="agent-tab-slot"></span>
        </nav>
        <div class="tabs-actions">
          <button type="button" class="tab-action-icon" data-testid="file-open-editor" data-action="open-file-in-editor" data-i18n-title="open_editor" title="打开编辑器">
            <span data-i18n="btn_edit">编辑</span>
          </button>
          <button type="button" class="icon-btn" data-action="toggle-right" data-i18n-title="collapse_panel" title="收起面板">
            <span class="ico-panel ico-panel-right" aria-hidden="true"></span>
          </button>
        </div>
      </header>
      <div id="right-viewport" class="right-viewport"></div>
    </aside>

  </div>

  <!-- Context menu -->
  <div id="ctx-menu" class="ctx-menu" role="menu" hidden></div>

  <!-- Settings Modal Container -->
  <div id="settings-overlay" class="sm-ov" style="display:none"></div>

  <!-- Dialog Overlay Container -->
  <div id="dialog-overlay" class="modal-overlay" style="display:none"></div>

  <!-- Fullscreen 401 Unauthorized Notice Container -->
  <div id="auth-overlay" class="auth-overlay" style="display:none"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
